<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="./index.html">&lt;- Voltar</a>
    </nav>
    <main class="pagina-formulario">
        <h1>Adicionar filme</h1>
        <form id="form-filme">
            <p><label for="title">Título</label><input id="title" name="titulo" type="text" required></p>
            <p><label for="year">Ano</label><input id="year" name="ano" type="number" min="1888" max="2030" required></p>
            <p><label for="gender">Gênero</label><input id="gender" name="genero" type="text" required></p>
            <p><label for="url">URL do pôster</label><input id="url" name="poster" type="text"></p>
            <p>
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="quero">Quero Assistir</option>
                    <option value="assistido">Assistido</option>
                    <option value="assistindo">Assistindo</option>
                </select>
            </p>
            <p><label for="nota">Nota (1-5)</label><input id="nota" name="nota" type="number" min="1" max="5" required></p>
            <p><label for="comentario">Comentário</label><textarea id="comentario" name="comentario"></textarea></p>
            <div class="acoes">
                <button type="button">Cancelar</button>
                <button class="primario" type="submit">Salvar</button>
            </div>
        </form>
    </main>
</body>
</html>
