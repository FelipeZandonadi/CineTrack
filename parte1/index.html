<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>CineTrack</h1>
        <input type="search" aria-label="Buscar filme">
        <button type="button" aria-label="Adicionar filme">
            <span aria-hidden="true">+</span><span class="texto-adicionar"> Adicionar</span>
        </button>
    </header>
    <nav aria-label="Filtros de status">
        <button class="ativo" type="button" data-status="todos">Todos</button>
        <button class="desativo" type="button" data-status="assistido">Assistido</button>
        <button class="desativo" type="button" data-status="assistindo">Assistindo</button>
        <button class="desativo" type="button" data-status="quero">Quero Assistir</button>
    </nav>
    <main>
        <section id="lista" aria-live="polite"></section>
    </main>
    <div id="modal" hidden>
        <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <h2 id="modal-titulo">Adicionar filme</h2>
            <form id="form-filme">
                <p><label for="title">Título</label><input id="title" name="titulo" type="text" required></p>
                <p><label for="year">Ano</label><input id="year" name="ano" type="number" min="1888" max="2030" required></p>
                <p><label for="gender">Gênero</label><input id="gender" name="genero" type="text" required></p>
                <p><label for="url">URL do pôster</label><input id="url" name="poster" type="text"></p>
                <p>
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="quero">Quero Assistir</option>
                        <option value="assistido">Assistido</option>
                        <option value="assistindo">Assistindo</option>
                    </select>
                </p>
                <p><label for="nota">Nota (1-5)</label><input id="nota" name="nota" type="number" min="1" max="5" required></p>
                <p><label for="comentario">Comentário</label><textarea id="comentario" name="comentario"></textarea></p>
                <div class="acoes">
                    <button type="button">Cancelar</button>
                    <button class="primario" type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <footer>
        <small>CineTrack - UEM</small>
        <p><a href="adicionar.html">Adicionar filme</a></p>
        <p><a href="sobre.html">Sobre o CineTrack</a></p>
    </footer>
    <script src="app.js"></script>
</body>

</html>
